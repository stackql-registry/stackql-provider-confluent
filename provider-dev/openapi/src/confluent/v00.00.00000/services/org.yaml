          description: Environment.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  `Environment` objects represent an isolated namespace for your
                  Confluent resources

                  for organizational purposes.


                  The API allows you to create, delete, and update your
                  environments. You can retrieve

                  individual environments as well as a list of all your
                  environments.



